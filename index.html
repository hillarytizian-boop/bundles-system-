<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BingwaSokoniDeals – Premium Bundles</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #070b12;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        .glass-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 1rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f97316, #fbbf24);
            border: none;
            color: white;
            font-weight: 700;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .badge-popular {
            background: linear-gradient(135deg, #f97316, #fbbf24);
            color: white;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            box-shadow: 0 0 8px rgba(249,115,22,0.5);
        }
        .price {
            background: linear-gradient(135deg, #f97316, #fbbf24);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 900;
        }
        .category-badge {
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            background: rgba(6,182,212,0.15);
            color: #06b6d4;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.2rem;
        }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(7,11,18,0.9);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1.5rem;
            padding: 1.5rem;
            max-width: 400px;
            width: 90%;
        }
        .input-glass {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 0.8rem;
            padding: 0.8rem;
            color: white;
        }
        .tab-active {
            background: linear-gradient(135deg, rgba(249,115,22,0.2), rgba(251,191,36,0.1));
            border: 1px solid rgba(249,115,22,0.4);
            color: white;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        // ---------- DATA ----------
        const BUNDLES = [
            { id:"1",  name:"1GB – 1 Hour Blitz",        category:"DATA",    price:19,   volume:"1GB",       validity:"1 Hour",        isPopular:false },
            { id:"2",  name:"250MB – Daily Starter",      category:"DATA",    price:20,   volume:"250MB",     validity:"24 Hours",      isPopular:false },
            { id:"3",  name:"1.25GB – Till Midnight",     category:"DATA",    price:55,   volume:"1.25GB",    validity:"Till Midnight", isPopular:true  },
            { id:"4",  name:"1.5GB – 3 Hour Turbo",       category:"DATA",    price:50,   volume:"1.5GB",     validity:"3 Hours",       isPopular:false },
            { id:"5",  name:"350MB – Weekly Lite",        category:"DATA",    price:49,   volume:"350MB",     validity:"7 Days",        isPopular:false },
            { id:"6",  name:"1GB – Daily Power",          category:"DATA",    price:99,   volume:"1GB",       validity:"24 Hours",      isPopular:true  },
            { id:"7",  name:"2.5GB – Weekly Value",       category:"DATA",    price:300,  volume:"2.5GB",     validity:"7 Days",        isPopular:true  },
            { id:"8",  name:"10GB – Weekly Premium",      category:"DATA",    price:700,  volume:"10GB",      validity:"7 Days",        isPopular:true  },
            { id:"9",  name:"2GB – Multi Daily",          category:"DATA",    price:110,  volume:"2GB",       validity:"24 Hours",      isPopular:true  },
            { id:"10", name:"1GB – Multi 1 Hour",         category:"DATA",    price:22,   volume:"1GB",       validity:"1 Hour",        isPopular:false },
            { id:"11", name:"1.5GB – Multi 3 Hours",      category:"DATA",    price:52,   volume:"1.5GB",     validity:"3 Hours",       isPopular:false },
            { id:"12", name:"20 SMS – Daily Spark",       category:"SMS",     price:5,    volume:"20 SMS",    validity:"24 Hours",      isPopular:false },
            { id:"13", name:"200 SMS – Daily Chatter",    category:"SMS",     price:10,   volume:"200 SMS",   validity:"24 Hours",      isPopular:false },
            { id:"14", name:"1000 SMS – Daily Blast",     category:"SMS",     price:18,   volume:"1000 SMS",  validity:"24 Hours",      isPopular:true  },
            { id:"15", name:"1000 SMS – Weekly Pack",     category:"SMS",     price:30,   volume:"1000 SMS",  validity:"7 Days",        isPopular:false },
            { id:"16", name:"7000 SMS – Weekly Mega",     category:"SMS",     price:48,   volume:"7000 SMS",  validity:"7 Days",        isPopular:true  },
            { id:"17", name:"1500 SMS – Monthly Plus",    category:"SMS",     price:100,  volume:"1500 SMS",  validity:"30 Days",       isPopular:false },
            { id:"18", name:"3500 SMS – Monthly Elite",   category:"SMS",     price:200,  volume:"3500 SMS",  validity:"30 Days",       isPopular:true  },
            { id:"19", name:"45 Min – 3 Hour Rush",       category:"MINUTES", price:23,   volume:"45 Min",    validity:"3 Hours",       isPopular:false },
            { id:"20", name:"50 Min – Till Midnight",     category:"MINUTES", price:51,   volume:"50 Min",    validity:"Till Midnight", isPopular:false },
            { id:"21", name:"250 Min – Weekly Talktime",  category:"MINUTES", price:250,  volume:"250 Min",   validity:"7 Days",        isPopular:true  },
            { id:"22", name:"1250 Min – Monthly Mega",    category:"MINUTES", price:1000, volume:"1250 Min",  validity:"30 Days",       isPopular:true  },
        ];
        const MOCK_TXNS = [
            { id:"t1", phone:"0712345678", bundle:"1GB – Daily Power",       amount:99,  status:"SUCCESS", mpesa:"QWE123456", date:"2025-05-07" },
            { id:"t2", phone:"0798765432", bundle:"10GB – Weekly Premium",   amount:700, status:"SUCCESS", mpesa:"ABC789012", date:"2025-05-07" },
            { id:"t3", phone:"0756789012", bundle:"7000 SMS – Weekly Mega",  amount:48,  status:"PENDING", mpesa:null,        date:"2025-05-08" },
            { id:"t4", phone:"0723456789", bundle:"2.5GB – Weekly Value",    amount:300, status:"SUCCESS", mpesa:"XYZ345678", date:"2025-05-08" },
            { id:"t5", phone:"0711223344", bundle:"250 Min – Weekly",        amount:250, status:"FAILED",  mpesa:null,        date:"2025-05-08" },
            { id:"t6", phone:"0745678901", bundle:"1.25GB – Till Midnight",  amount:55,  status:"SUCCESS", mpesa:"POI654321", date:"2025-05-09" },
        ];
        const TOP_BUNDLES = [
            { name:"1GB – Daily Power",     count:32, rev:3168 },
            { name:"10GB – Weekly Premium", count:18, rev:12600 },
            { name:"2.5GB – Weekly Value",  count:14, rev:4200 },
            { name:"7000 SMS – Mega",       count:25, rev:1200 },
            { name:"250 Min – Weekly",      count:9,  rev:2250 },
        ];
        const categoryIcons = { DATA:"📶", SMS:"💬", MINUTES:"📞" };
        const categoryColors = { DATA:"#06b6d4", SMS:"#a78bfa", MINUTES:"#10b981" };
        const statusColors = { SUCCESS:"#10b981", PENDING:"#fbbf24", FAILED:"#ef4444" };
        const statusBg = { SUCCESS:"rgba(16,185,129,0.15)", PENDING:"rgba(251,191,36,0.15)", FAILED:"rgba(239,68,68,0.15)" };
        const tabs = [
            { id:"ALL", label:"All Bundles", icon:"🌐" },
            { id:"DATA", label:"Data", icon:"📶" },
            { id:"SMS", label:"SMS", icon:"💬" },
            { id:"MINUTES", label:"Minutes", icon:"📞" },
        ];
        // ---------- STATE ----------
        let view = "store";
        let activeTab = "ALL";
        let search = "";
        let selectedBundle = null;
        let toastMessage = null;
        let toastTimeout = null;

        function showToast(msg) {
            if (toastTimeout) clearTimeout(toastTimeout);
            toastMessage = msg;
            render();
            toastTimeout = setTimeout(() => {
                toastMessage = null;
                render();
            }, 4000);
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;
            app.innerHTML = '';
            const container = document.createElement('div');
            container.style.background = '#070b12';
            container.style.minHeight = '100vh';

            // Header
            const header = document.createElement('header');
            header.style.position = 'sticky';
            header.style.top = '0';
            header.style.zIndex = '50';
            header.style.background = 'rgba(7,11,18,0.9)';
            header.style.backdropFilter = 'blur(20px)';
            header.style.borderBottom = '1px solid rgba(255,255,255,0.06)';
            header.innerHTML = `
                <div style="max-width:1200px; margin:0 auto; padding:0 20px; height:56px; display:flex; align-items:center; justify-content:space-between;">
                    <button id="logoBtn" style="display:flex; align-items:center; gap:10px; background:none; border:none; cursor:pointer;">
                        <div style="width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:900; color:white; background:linear-gradient(135deg,#f97316,#fbbf24);">B</div>
                        <div style="text-align:left;">
                            <div style="font-size:14px; font-weight:900; background:linear-gradient(135deg,#f97316,#fbbf24); -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1;">BingwaSokoni</div>
                            <div style="font-size:8.5px; color:#1e293b; text-transform:uppercase; letter-spacing:0.15em;">Deals</div>
                        </div>
                    </button>
                    <div style="display:flex; align-items:center; gap:7px; font-size:11px; color:#334155;">
                        <span style="width:6px; height:6px; border-radius:50%; background:#10b981;"></span>
                        M-Pesa Ready · 22 Bundles · 24/7 Support
                    </div>
                    <div style="display:flex; align-items:center; gap:12px;">
                        <span style="font-size:11px; color:#334155; font-family:monospace;">📞 0119999777</span>
                        <a href="/admin" id="adminLink" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.09); color:white; padding:7px 14px; border-radius:10px; font-size:12px; text-decoration:none; font-weight:700;">Admin →</a>
                    </div>
                </div>
            `;
            container.appendChild(header);
            if (view === "store") {
                const storeDiv = document.createElement('div');
                storeDiv.style.background = 'radial-gradient(at 15% 8%, rgba(249,115,22,0.09) 0, transparent 55%), radial-gradient(at 85% 15%, rgba(6,182,212,0.05) 0, transparent 50%), #070b12';
                // Hero
                const hero = document.createElement('div');
                hero.style.padding = '52px 20px 30px';
                hero.style.textAlign = 'center';
                hero.style.maxWidth = '780px';
                hero.style.margin = '0 auto';
                hero.innerHTML = `
                    <div style="display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:30px; padding:5px 15px; font-size:11px; color:#64748b; margin-bottom:22px;">
                        <span style="width:5px; height:5px; border-radius:50%; background:#10b981;"></span>
                        M-Pesa Integrated · Instant Activation
                    </div>
                    <h1 style="font-size:clamp(28px,5.5vw,54px); font-weight:900; line-height:1.06; color:white; margin-bottom:14px;">
                        Kenya's Best<br/>
                        <span style="background:linear-gradient(135deg,#f97316 0%,#fbbf24 50%,#f97316 100%); background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 3s linear infinite;">Bundle Deals</span>
                    </h1>
                    <p style="color:#475569; font-size:15px; margin-bottom:26px;">Data, SMS & Minutes bundles at unbeatable prices. Pay instantly with M-Pesa.</p>
                    <div style="position:relative; max-width:440px; margin:0 auto;">
                        <span style="position:absolute; left:13px; top:50%; transform:translateY(-50%);">🔍</span>
                        <input id="searchInput" type="text" placeholder="Search bundles…" style="width:100%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09); border-radius:13px; padding:13px 40px; color:white;">
                    </div>
                `;
                const searchInput = hero.querySelector('#searchInput');
                if (searchInput) {
                    searchInput.value = search;
                    searchInput.addEventListener('input', (e) => { search = e.target.value; render(); });
                }
                storeDiv.appendChild(hero);

                // Stats bar
                const statsBar = document.createElement('div');
                statsBar.style.maxWidth = '1200px';
                statsBar.style.margin = '0 auto';
                statsBar.style.padding = '0 20px 28px';
                statsBar.innerHTML = `
                    <div style="display:grid; grid-template-columns:repeat(4,1fr); background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:14px;">
                        <div style="padding:14px; text-align:center;"><div>📦</div><div style="font-size:20px; font-weight:900; color:#f97316;">22+</div><div>Active Bundles</div></div>
                        <div style="padding:14px; text-align:center;"><div>😊</div><div style="font-size:20px; font-weight:900; color:#10b981;">50K+</div><div>Happy Customers</div></div>
                        <div style="padding:14px; text-align:center;"><div>⚡</div><div style="font-size:20px; font-weight:900; color:#06b6d4;">99.9%</div><div>Uptime</div></div>
                        <div style="padding:14px; text-align:center;"><div>🎧</div><div style="font-size:20px; font-weight:900; color:#a78bfa;">Live</div><div>Support 24/7</div></div>
                    </div>
                `;
                storeDiv.appendChild(statsBar);

                // Tabs
                const tabsDiv = document.createElement('div');
                tabsDiv.style.display = 'flex';
                tabsDiv.style.gap = '7px';
                tabsDiv.style.margin = '0 auto 20px';
                tabsDiv.style.maxWidth = '1200px';
                tabsDiv.style.padding = '0 20px';
                tabs.forEach(tab => {
                    const btn = document.createElement('button');
                    btn.textContent = `${tab.icon} ${tab.label}`;
                    btn.style.padding = '8px 16px';
                    btn.style.borderRadius = '11px';
                    btn.style.fontWeight = '700';
                    btn.style.cursor = 'pointer';
                    btn.style.background = activeTab === tab.id ? 'linear-gradient(135deg,rgba(249,115,22,0.17),rgba(251,191,36,0.07))' : 'rgba(255,255,255,0.04)';
                    btn.style.border = activeTab === tab.id ? '1px solid rgba(249,115,22,0.4)' : '1px solid transparent';
                    btn.style.color = activeTab === tab.id ? 'white' : '#475569';
                    btn.onclick = () => { activeTab = tab.id; search = ''; render(); };
                    tabsDiv.appendChild(btn);
                });
                storeDiv.appendChild(tabsDiv);

                // Bundles grid
                const filtered = BUNDLES.filter(b => {
                    const catMatch = activeTab === 'ALL' || b.category === activeTab;
                    const searchMatch = !search.trim() || b.name.toLowerCase().includes(search.toLowerCase()) || b.volume.toLowerCase().includes(search.toLowerCase());
                    return catMatch && searchMatch;
                });
                const gridDiv = document.createElement('div');
                gridDiv.style.maxWidth = '1200px';
                gridDiv.style.margin = '0 auto';
                gridDiv.style.padding = '0 20px 40px';
                if (filtered.length === 0) {
                    gridDiv.innerHTML = `<div style="text-align:center; padding:40px;">📭 No bundles found</div>`;
                } else {
                    const gridInner = document.createElement('div');
                    gridInner.className = 'grid';
                    filtered.forEach((b, idx) => {
                        const card = document.createElement('div');
                        card.className = 'glass-card';
                        card.style.padding = '18px 16px';
                        card.style.cursor = 'pointer';
                        card.style.transition = 'all 0.25s';
                        card.style.animation = `fadeUp 0.4s ease-out ${idx * 0.04}s both`;
                        card.onmouseenter = () => { card.style.transform = 'translateY(-5px)'; card.style.border = `1px solid ${categoryColors[b.category]}55`; };
                        card.onmouseleave = () => { card.style.transform = 'translateY(0)'; card.style.border = '1px solid rgba(255,255,255,0.08)'; };
                        card.onclick = () => { selectedBundle = b; renderModal(); };
                        if (b.isPopular) {
                            const pop = document.createElement('div');
                            pop.className = 'badge-popular';
                            pop.textContent = '⚡ Popular';
                            pop.style.position = 'absolute';
                            pop.style.top = '-9px';
                            pop.style.left = '12px';
                            card.style.position = 'relative';
                            card.appendChild(pop);
                        }
                        card.innerHTML += `
                            <div style="display:flex; align-items:flex-start; justify-content:space-between;">
                                <div style="display:flex; gap:8px;"><div style="width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; background:rgba(255,255,255,0.05);">${categoryIcons[b.category]}</div><div><div style="font-size:8.5px; color:#475569;">${b.category}</div><div style="font-size:11px; color:#cbd5e1;">${b.name}</div></div></div>
                                <span style="font-size:9px; background:rgba(255,255,255,0.06); padding:3px 7px; border-radius:20px;">⏱ ${b.validity}</span>
                            </div>
                            <div style="text-align:center; padding:8px 0;"><div style="font-size:28px; font-weight:900; background:linear-gradient(135deg,#f1f5f9 30%,#94a3b8); -webkit-background-clip:text; color:transparent;">${b.volume}</div></div>
                            <div style="height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent);"></div>
                            <div style="display:flex; justify-content:space-between;"><div><div style="font-size:9px; color:#334155;">Price</div><div class="price" style="font-size:20px;">KES ${b.price.toLocaleString()}</div></div><button class="btn-primary" style="font-size:11px; padding:6px 12px;">Buy Now</button></div>
                        `;
                        const btn = card.querySelector('.btn-primary');
                        if (btn) btn.onclick = (e) => { e.stopPropagation(); selectedBundle = b; renderModal(); };
                        gridInner.appendChild(card);
                    });
                    gridDiv.appendChild(gridInner);
                }
                storeDiv.appendChild(gridDiv);

                // Support banner
                const support = document.createElement('div');
                support.style.maxWidth = '1200px';
                support.style.margin = '0 auto';
                support.style.padding = '0 20px 40px';
                support.innerHTML = `
                    <div style="background:linear-gradient(135deg,rgba(249,115,22,0.07),rgba(251,191,36,0.03)); border-radius:14px; padding:18px 24px; display:flex; justify-content:space-between; align-items:center;">
                        <div style="display:flex; gap:14px;"><div style="font-size:32px;">🎧</div><div><div>Customer Support – 24/7</div><div>📞 0119999777</div></div></div>
                        <a href="tel:0119999777" style="background:linear-gradient(135deg,#f97316,#fbbf24); padding:8px 20px; border-radius:11px; color:white; text-decoration:none;">Call Now</a>
                    </div>
                `;
                storeDiv.appendChild(support);
                container.appendChild(storeDiv);
            }
            // Footer
            const footer = document.createElement('footer');
            footer.style.textAlign = 'center';
            footer.style.padding = '16px';
            footer.style.borderTop = '1px solid rgba(255,255,255,0.04)';
            footer.innerHTML = `<p style="font-size:10.5px; color:#1e293b;">© ${new Date().getFullYear()} BingwaSokoniDeals · Created by TizianTech Edge</p>`;
            container.appendChild(footer);

            if (toastMessage) {
                const toastDiv = document.createElement('div');
                toastDiv.style.position = 'fixed';
                toastDiv.style.bottom = '20px';
                toastDiv.style.left = '50%';
                toastDiv.style.transform = 'translateX(-50%)';
                toastDiv.style.background = '#0f172a';
                toastDiv.style.border = '1px solid rgba(16,185,129,0.3)';
                toastDiv.style.borderRadius = '12px';
                toastDiv.style.padding = '8px 20px';
                toastDiv.textContent = toastMessage;
                container.appendChild(toastDiv);
            }
            app.appendChild(container);
        }

        function renderModal() {
            if (!selectedBundle) return;
            let modalDiv = document.getElementById('dynamic-modal');
            if (modalDiv) modalDiv.remove();
            modalDiv = document.createElement('div');
            modalDiv.id = 'dynamic-modal';
            modalDiv.className = 'modal';
            const content = document.createElement('div');
            content.className = 'modal-content';
            content.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:1rem;"><h3>Complete Purchase</h3><button id="closeModalBtn" style="background:none; border:none; color:#94a3b8; font-size:1.2rem;">✕</button></div>
                <div><strong>${selectedBundle.name}</strong><br>${selectedBundle.volume} · ${selectedBundle.validity}</div>
                <div style="margin-top:1rem; text-align:center; background:rgba(249,115,22,0.07); padding:0.8rem; border-radius:0.8rem;"><div>Total Amount</div><div class="price" style="font-size:2rem;">KES ${selectedBundle.price.toLocaleString()}</div></div>
                <div style="margin-top:1rem;"><label>📱 Safaricom Number</label><input type="tel" id="phoneNumber" class="input-glass" placeholder="0712345678"></div>
                <div style="display:flex; gap:0.8rem; margin-top:1.5rem;">
                    <button id="modalCancelBtn" style="flex:1; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09); color:#94a3b8; border-radius:0.8rem; padding:0.6rem;">Cancel</button>
                    <button id="modalPayBtn" style="flex:1; background:linear-gradient(135deg,#f97316,#fbbf24); border:none; border-radius:0.8rem; padding:0.6rem; color:white; font-weight:bold;">Pay with M-Pesa</button>
                </div>
            `;
            modalDiv.appendChild(content);
            document.body.appendChild(modalDiv);
            document.getElementById('closeModalBtn')?.addEventListener('click', () => { modalDiv.remove(); selectedBundle = null; });
            document.getElementById('modalCancelBtn')?.addEventListener('click', () => { modalDiv.remove(); selectedBundle = null; });
            document.getElementById('modalPayBtn')?.addEventListener('click', () => {
                const phone = document.getElementById('phoneNumber').value;
                if (!phone) { alert('Enter phone number'); return; }
                modalDiv.remove();
                showToast(`💚 Demo: Payment initiated for ${selectedBundle.name}. In production, M-Pesa STK push would be sent to ${phone}.`);
                selectedBundle = null;
            });
        }

        render();
    </script>
</body>
</html>
